version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go test -short ./...

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
  draft: false
  prerelease: auto

snapshot:
  version_template: '{{ incpatch .Version }}'

changelog:
  use: git
  sort: asc
  filters:
    include:
      - "^feat:"
      - "^fix:"
      - "^chore:"
      - "^docs:"
  groups:
    - title: '🛠 Dependency updates'
      regexp: '^fix\(deps\):|^feat\(deps\):'
      order: 300
    - title: '✨ New Features'
      regexp: '^feat(\([^)]*\))?:'
      order: 100
    - title: '🐛 Bug fixes'
      regexp: '^fix(\([^)]*\))?:'
      order: 200
    - title: '📖 Documentation updates'
      regexp: '^docs(\([^)]*\))?:'
      order: 400
    - title: '📦 Other work'
      regexp: '^chore(\([^)]*\))?:|^chore:'
      order: 9999
