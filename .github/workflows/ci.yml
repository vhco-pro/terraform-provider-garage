name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./... -v -count=1 -race

  acceptance:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start Garage
        run: docker compose -f testdata/docker-compose.yml up -d --wait
      - name: Run acceptance tests
        run: go test ./... -v -count=1 -timeout 30m -race
        env:
          TF_ACC: "1"
          GARAGE_ENDPOINT: http://localhost:3903
          GARAGE_TOKEN: test-admin-token
      - name: Garage logs
        if: failure()
        run: docker compose -f testdata/docker-compose.yml logs
