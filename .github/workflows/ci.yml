name: CI

# vhco-pro/go-release-workflow, separate-workflows arrangement.
# Needs: RELEASE_APP_CLIENT_ID (variable), RELEASE_APP_PRIVATE_KEY (secret).
# The App's tag push starts release.yml; so does a tag pushed by hand.
#
# Runs on branch pushes, not pull_request: GitVersion needs the real branch,
# and a PR shows these push checks on its head commit. A private repository
# that runs CI only on PRs may use pull_request instead; those runs never tag.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: michielvha/go-ci-action@ab14d6420148179e8d20ecc0b7cb89760193cb37 # v0.1.0

  # Against a real Garage in Docker. -race here also covers the unit tests.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Garage
        run: docker compose -f testdata/docker-compose.yml up -d
      - name: Wait for Garage admin API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3903/health; then
              echo "Garage admin API is ready"
              break
            fi
            echo "Waiting for Garage... ($i/30)"
            sleep 2
          done
      - name: Configure Garage layout
        run: |
          # Get the node ID from the status endpoint
          NODE_ID=$(curl -sf -H "Authorization: Bearer test-admin-token" \
            http://localhost:3903/v2/GetClusterStatus | jq -r '.nodes[] | select(.isUp) | .id')
          echo "Node ID: $NODE_ID"
          # Assign the node to a zone with 1GB capacity
          curl -v -X POST -H "Authorization: Bearer test-admin-token" \
            -H "Content-Type: application/json" \
            -d "{\"roles\": [{\"id\": \"$NODE_ID\", \"zone\": \"dc1\", \"capacity\": 1073741824, \"tags\": []}]}" \
            http://localhost:3903/v2/UpdateClusterLayout
          # Apply the layout
          LAYOUT_VERSION=$(curl -sf -H "Authorization: Bearer test-admin-token" \
            http://localhost:3903/v2/GetClusterLayout | jq '.version + 1')
          curl -sf -X POST -H "Authorization: Bearer test-admin-token" \
            -H "Content-Type: application/json" \
            -d "{\"version\": $LAYOUT_VERSION}" \
            http://localhost:3903/v2/ApplyClusterLayout
          echo "Layout applied successfully"
      - name: Run acceptance tests
        run: go test ./... -v -count=1 -timeout 30m -race
        env:
          TF_ACC: "1"
          GARAGE_ENDPOINT: http://localhost:3903
          # checkov:skip=CKV_SECRET_6: test token for CI
          GARAGE_TOKEN: test-admin-token
      - name: Garage logs
        if: failure()
        run: docker compose -f testdata/docker-compose.yml logs

  # Tags main, and a branch whose open PR has the release:preview label at this
  # commit. Every other run only calculates the version.
  version:
    needs: [verify, acceptance]
    permissions:
      contents: read
      pull-requests: read
    uses: vhco-pro/version-workflow/.github/workflows/version.yml@3b78b04df802ea1592cbe19338d7a882d1888389 # v0.1.0
    with:
      release-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
